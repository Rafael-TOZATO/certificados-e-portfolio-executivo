<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="55%" stop-color="#0a162d"/>
      <stop offset="100%" stop-color="#071b33"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#14f1d9"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="32" y="26" width="1136" height="328" rx="18"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <circle cx="1020" cy="180" r="260" fill="url(#glowRight)"/>

  <!-- Card Executivo -->
  <rect x="32" y="26" width="1136" height="328" rx="18" fill="#0b1730" fill-opacity="0.82" stroke="url(#accentGrad)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Feixe de luz animado atravessando o card -->
  <g clip-path="url(#cardClip)">
    <polygon points="-220,0 -80,0 -180,380 -320,380" fill="url(#sheenGrad)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1550 0" dur="4.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Barra lateral de destaque -->
  <rect x="52" y="50" width="6" height="280" rx="3" fill="url(#accentGrad)"/>

  <!-- Header -->
  <circle cx="84" cy="64" r="5" fill="#14f1d9">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="69" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#14f1d9" letter-spacing="1.5">
    RAFAEL TOZATO • EXECUTIVE TECH PORTFOLIO
  </text>

  <text x="1136" y="69" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#82aaff" letter-spacing="1">
    CERTIFICADOS &amp; ARQUITETURA
  </text>

  <!-- Título Principal -->
  <text x="78" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="bold" fill="#f2f6fc" letter-spacing="0.5">
    DOSSIÊ TÉCNICO EXECUTIVO
  </text>
  <text x="78" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#a0b2cc">
    Ecossistema de Certificações, Engenharia de Software &amp; Sistemas Inteligentes
  </text>

  <!-- Linha divisória animada -->
  <line x1="78" y1="180" x2="920" y2="180" stroke="#388bfd" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="78" y1="180" x2="620" y2="180" stroke="url(#accentGrad)" stroke-width="2.5">
    <animate attributeName="x2" values="280;880;280" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- Pills de Especialidades -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">
    <rect x="78" y="204" width="192" height="36" rx="18" fill="#0d2647" stroke="#00e5ff" stroke-opacity="0.6"/>
    <text x="174" y="227" text-anchor="middle" fill="#e6f4ff">Engenharia de Software</text>

    <rect x="284" y="204" width="214" height="36" rx="18" fill="#0d2647" stroke="#388bfd" stroke-opacity="0.6"/>
    <text x="391" y="227" text-anchor="middle" fill="#e6f4ff">Arquitetura Java &amp; Spring</text>

    <rect x="512" y="204" width="186" height="36" rx="18" fill="#0d2647" stroke="#14f1d9" stroke-opacity="0.6"/>
    <text x="605" y="227" text-anchor="middle" fill="#e6f4ff">Inteligência Artificial</text>

    <rect x="712" y="204" width="182" height="36" rx="18" fill="#0d2647" stroke="#388bfd" stroke-opacity="0.6"/>
    <text x="803" y="227" text-anchor="middle" fill="#e6f4ff">Engenharia de Dados</text>
  </g>

  <!-- Rodapé / Slogan e Repositório -->
  <text x="78" y="286" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#00e5ff">
    &gt;_ Reliable. Scalable. Intelligent Systems.
  </text>
  <text x="78" y="316" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#9bb4d4">
    github.com/Rafael-TOZATO/certificados-e-portfolio-executivo
  </text>

  <!-- Núcleo Orbital Animado (Direita) -->
  <g transform="translate(1055, 225)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#00e5ff" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#388bfd" stroke-opacity="0.45" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="68" cy="0" r="4.5" fill="#14f1d9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="-46" cy="0" r="4" fill="#00e5ff"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#00e5ff" fill-opacity="0.2">
      <animate attributeName="r" values="12;20;12" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="7" fill="#00e5ff"/>
  </g>
</svg>